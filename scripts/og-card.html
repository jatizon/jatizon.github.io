<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Sora:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; display:flex; flex-direction:column; justify-content:center;
         gap:20px; padding:80px; font-family:Inter,sans-serif; color:#1c1917;
         background:
           radial-gradient(60rem 28rem at 10% -10%, rgba(79,70,229,.25), transparent),
           radial-gradient(45rem 24rem at 100% 10%, rgba(6,182,212,.22), transparent),
           #fafaf9; }
  .badge { align-self:flex-start; border:1px solid rgba(79,70,229,.3); background:rgba(79,70,229,.1);
           color:#4f46e5; border-radius:999px; padding:8px 18px; font-size:20px; font-weight:500; }
  h1 { font-family:Sora,sans-serif; font-size:76px; letter-spacing:-.02em; }
  p  { font-size:30px; color:#57534e; }
  .stats { display:flex; gap:16px; margin-top:24px; }
  .stat { border:1px solid #e7e5e4; background:rgba(255,255,255,.8); border-radius:16px; padding:20px 26px; }
  .v { font-family:Sora,sans-serif; font-size:32px; font-weight:700; color:#4f46e5; }
  .l { font-size:19px; color:#57534e; margin-top:4px; }
</style></head>
<body>
  <span class="badge">Open to software engineering roles</span>
  <h1>José Alberto Tizon</h1>
  <p>Computer Engineering student at ITA · automation and backend engineering.</p>
  <div class="stats">
    <div class="stat"><div class="v">7th / 141</div><div class="l">class rank at ITA</div></div>
    <div class="stat"><div class="v">IPhO 2022</div><div class="l">bronze medal</div></div>
    <div class="stat"><div class="v">200</div><div class="l">monthly reports automated</div></div>
  </div>
</body></html>
