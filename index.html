    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Sets <html lang> before first paint, matching whatever language the
      // page will actually render in (LanguageProvider does the same
      // detection on mount, but that's after React has already rendered
      // once with the "en" fallback below — this avoids that flash for
      // assistive tech and for anyone viewing source/View Page Source).
      (function () {
        try {
          var stored = localStorage.getItem("lang");
          var lang =
            stored === "en" || stored === "pt"
              ? stored
              : navigator.language.toLowerCase().indexOf("pt") === 0
                ? "pt"
                : "en";
          document.documentElement.lang = lang;
        } catch (e) {
          // localStorage unavailable (private mode) — the "en" attribute
          // above stays, same fallback LanguageProvider would pick.
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap"

    />

    <!--
      Analytics: GoatCounter — no cookies, no personal data, respects
      Do Not Track automatically, and skips counting on localhost.
      Dashboard: https://josetizon.goatcounter.com
    -->
    <script
      data-goatcounter="https://josetizon.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
